name: Deploy Examples to GitHub Pages

on:
  push:
    branches: [ master ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24.x
        cache: 'npm'
        cache-dependency-path: javascript/package-lock.json
    - run: npm ci
      working-directory: ./javascript
    - run: npm run build-examples
      working-directory: ./javascript

    # the published urls are kept at "javascript/example/bundle" so existing links keep working,
    # and the examples load robot models from "urdf" at the site root
    - name: Stage site
      run: |
        mkdir -p site/javascript/example
        cp -r javascript/example/bundle site/javascript/example/bundle
        cp -r urdf site/urdf

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./site

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
